<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5e7" />
    <script>
      // Apply the chosen colour mode before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem('pc.colorMode');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.colorMode = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0f1a' : '#faf5e7');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Paper Cricket — কাগজের ক্রিকেট. A nostalgic, real-time two-player paper cricket game. Spin the paper, slide the pen, chase the total."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Paper Cricket · কাগজের ক্রিকেট</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
